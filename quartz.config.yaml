# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 用一家奶茶店学会股票投资
  pageTitleSuffix: "｜青禾投资课"
  enableSPA: true
  enablePopovers: false
  analytics:
    - provider: umami
      websiteId: b8b4efd0-332a-4c9a-96d2-e1d127155f5b
      host: https://cloud.umami.is
    - provider: google
      tagId: G-7V3SF2VL81
  locale: zh-CN
  baseUrl: qinghe.taoweng.site
  ignorePatterns:
    - .obsidian
    - private
    - source_notes
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Noto Serif SC
      body: Noto Sans SC
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f7f1e4"
        lightgray: "#e2ddd0"
        gray: "#6f7773"
        darkgray: "#2f3433"
        dark: "#234b42"
        secondary: "#3a7d6b"
        tertiary: "#b07e18"
        highlight: "rgba(58, 125, 107, 0.10)"
        textHighlight: "#f4cc7088"
      darkMode:
        light: "#191713"
        lightgray: "#302b25"
        gray: "#746b60"
        darkgray: "#d5c9b8"
        dark: "#f2eadf"
        secondary: "#d99a76"
        tertiary: "#9ab59e"
        highlight: "rgba(217, 154, 118, 0.14)"
        textHighlight: "#74612488"
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 10
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 20
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 40
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 50
  - source: "@quartz-community/description"
    enabled: true
    order: 60
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: 全书目录
      folderClickBehavior: collapse
      folderDefaultState: open
      useSavedState: true
    layout:
      position: left
      priority: 30
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/crazylxr/qinghe-investing-book
    layout:
      position: footer
      priority: 50
  - source: "@qinghe/book-toolbar"
    enabled: true
    options: {}
    order: 50
    layout:
      position: beforeBody
      priority: 1
  - source: "@qinghe/book-comments"
    enabled: true
    options:
      envId: https://taoweng-twikoo-netlify.netlify.app/.netlify/functions/twikoo
      pathPrefix: /qinghe-book
    layout:
      position: afterBody
      priority: 10
layout:
  groups: {}
  byPageType:
    content: {}
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
