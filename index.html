  <!-- Three variants of the online book reading experience, switchable via ?variant= on this prototype route. -->
  <style>
    :root {
      --tea: #3a7d6b;
      --tea-deep: #234b42;
      --gold: #e8b64a;
      --paper: #f7f1e4;
      --ink: #2f3433;
      --muted: #6f7773;
      --line: rgba(35, 75, 66, .16);
      --white: #fffdf7;
      --shadow: 0 24px 70px rgba(35, 75, 66, .13);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: ui-serif, "Noto Serif SC", "Songti SC", Georgia, serif; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .prototype-only { position: fixed; z-index: 50; }
    .proto-badge { top: 16px; right: 18px; padding: 7px 11px; color: #fff; background: rgba(25, 31, 29, .84); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; font: 700 10px/1 ui-sans-serif, system-ui; letter-spacing: .14em; backdrop-filter: blur(12px); }
    .switcher { left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 7px; color: #fff; background: rgba(20, 27, 25, .94); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; box-shadow: 0 14px 38px rgba(0,0,0,.28); font-family: ui-sans-serif, system-ui; backdrop-filter: blur(16px); }
    .switcher button { width: 38px; height: 38px; border: 0; border-radius: 50%; color: #fff; background: rgba(255,255,255,.1); cursor: pointer; }
    .switcher button:hover { background: var(--tea); }
    .switcher-label { min-width: 208px; padding: 0 14px; text-align: center; }
    .switcher-label strong { display: block; font-size: 12px; letter-spacing: .04em; }
    .switcher-label span { display: block; margin-top: 2px; color: rgba(255,255,255,.58); font-size: 10px; }
    .fade-in { animation: fade .28s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } }
    .progress-track { position: fixed; z-index: 40; top: 0; left: 0; width: 100%; height: 3px; background: transparent; }
    .progress-fill { height: 100%; width: 0; background: var(--gold); transition: width .08s linear; }

    /* Variant A — Paper reading room */
    .a-shell { min-height: 100vh; background: #f2ecdf; }
    .a-top { position: sticky; z-index: 10; top: 0; height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; color: var(--tea-deep); background: rgba(247,241,228,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
    .a-brand { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; }
    .leaf-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50% 50% 50% 12%; color: #fff; background: var(--tea); transform: rotate(-8deg); font: 700 15px/1 ui-sans-serif; }
    .a-tools { display: flex; gap: 8px; font: 12px/1 ui-sans-serif, system-ui; }
    .ghost { padding: 9px 13px; color: var(--tea-deep); border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.5); cursor: pointer; }
    .ghost:hover { color: #fff; background: var(--tea); }
    .a-grid { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 720px) 190px; gap: 52px; padding: 48px 5vw 120px; }
    .a-sidebar { position: sticky; top: 106px; align-self: start; font-family: ui-sans-serif, system-ui; }
    .a-book-mini { padding: 22px; color: #fff; background: var(--tea-deep); border-radius: 4px 22px 22px 4px; box-shadow: var(--shadow); }
    .a-book-mini small { color: #b8d5cb; font-size: 10px; letter-spacing: .13em; }
    .a-book-mini h2 { margin: 14px 0 10px; font-size: 20px; line-height: 1.5; }
    .a-book-mini p { margin: 0; color: #d7e4df; font-size: 12px; line-height: 1.7; }
    .a-toc-title { margin: 32px 0 12px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .a-toc { display: grid; gap: 4px; }
    .a-toc a { padding: 9px 12px; border-left: 2px solid transparent; color: #65706c; font-size: 12px; line-height: 1.45; }
    .a-toc a.active { color: var(--tea-deep); background: rgba(58,125,107,.08); border-left-color: var(--tea); font-weight: 700; }
    .a-article { padding: 56px 64px 72px; background: var(--white); border: 1px solid rgba(35,75,66,.08); box-shadow: 0 18px 60px rgba(67,61,46,.09); }
    .eyebrow { color: var(--tea); font: 700 11px/1 ui-sans-serif, system-ui; letter-spacing: .16em; text-transform: uppercase; }
    .a-article h1 { margin: 18px 0 16px; color: var(--tea-deep); font-size: clamp(36px, 4vw, 54px); line-height: 1.2; letter-spacing: -.04em; }
    .dek { margin: 0 0 44px; color: #717873; font-size: 17px; line-height: 1.85; }
    .scene { margin: 40px -28px; padding: 30px 34px; color: #f8f1df; background: var(--tea-deep); border-radius: 2px; font-size: 16px; line-height: 2; }
    .scene strong { color: #f4cc70; }
    .a-article h2 { margin: 50px 0 18px; color: var(--tea-deep); font-size: 25px; }
    .a-article p { margin: 0 0 22px; font-size: 17px; line-height: 2; }
    .formula { margin: 30px 0; padding: 24px; text-align: center; color: var(--tea-deep); background: #f1eee3; border: 1px solid var(--line); font: 700 23px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .callout { margin: 32px 0; padding: 22px 24px; background: #fff8df; border-left: 4px solid var(--gold); }
    .callout b { display: block; margin-bottom: 8px; color: #795c13; font-family: ui-sans-serif, system-ui; font-size: 12px; letter-spacing: .05em; }
    .a-margin { position: sticky; top: 110px; align-self: start; color: var(--muted); font-family: ui-sans-serif, system-ui; }
    .a-margin strong { display: block; color: var(--tea-deep); font-size: 12px; }
    .a-margin .ring { width: 72px; height: 72px; display: grid; place-items: center; margin: 14px 0; border: 6px solid #dce7df; border-top-color: var(--tea); border-radius: 50%; color: var(--tea-deep); font-size: 15px; font-weight: 800; }
    .a-margin p { font-size: 11px; line-height: 1.7; }

    /* Variant B — Immersive scroll */
    .b-shell { min-height: 100vh; color: #f8f1df; background: #173a34; }
    .b-hero { min-height: 92vh; position: relative; display: grid; align-items: end; overflow: hidden; padding: 7vw; }
    .b-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 78% 28%, rgba(232,182,74,.24), transparent 22%), radial-gradient(circle at 72% 34%, rgba(247,241,228,.07), transparent 36%), linear-gradient(145deg, #244e45, #102e29); }
    .b-shop { position: absolute; right: 7vw; top: 14vh; width: min(480px, 42vw); aspect-ratio: 3 / 2; border: 1px solid rgba(255,255,255,.16); background: linear-gradient(180deg, rgba(255,255,255,.08), transparent), #254c44; box-shadow: inset 0 -80px 0 #1a332e, 0 40px 90px rgba(0,0,0,.28); }
    .b-shop::before { content: "☘"; position: absolute; left: 50%; top: 20%; transform: translateX(-50%); width: 74px; height: 74px; display: grid; place-items: center; color: #173a34; background: var(--gold); border-radius: 50%; font-size: 32px; }
    .b-shop::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 20%; height: 32%; background: repeating-linear-gradient(90deg, #d8cba8 0 9%, #2e5a50 9% 18%); opacity: .78; }
    .b-title { position: relative; z-index: 2; max-width: 720px; }
    .b-kicker { display: flex; align-items: center; gap: 14px; color: #e8ce91; font: 700 12px/1 ui-sans-serif, system-ui; letter-spacing: .18em; }
    .b-kicker::before { content: ""; width: 42px; height: 1px; background: var(--gold); }
    .b-title h1 { margin: 24px 0; font-size: clamp(52px, 7.2vw, 105px); line-height: 1.05; letter-spacing: -.06em; }
    .b-title p { max-width: 560px; color: #cadbd5; font-size: 17px; line-height: 1.9; }
    .b-start { display: inline-flex; align-items: center; gap: 14px; margin-top: 26px; padding: 14px 20px; color: #173a34; background: var(--gold); border-radius: 999px; font: 800 13px/1 ui-sans-serif, system-ui; }
    .b-chapter { background: var(--paper); color: var(--ink); }
    .b-reading { max-width: 760px; margin: 0 auto; padding: 110px 28px 150px; }
    .b-num { display: block; color: var(--tea); font: 800 70px/1 ui-sans-serif, system-ui; opacity: .18; }
    .b-reading h2 { max-width: 680px; margin: -28px 0 38px; color: var(--tea-deep); font-size: clamp(38px, 5vw, 62px); line-height: 1.2; letter-spacing: -.04em; }
    .b-reading > p { margin: 0 0 28px; font-size: clamp(18px, 2.1vw, 21px); line-height: 2.05; }
    .b-quote { margin: 68px -9vw; padding: 64px 9vw; color: #fff; background: var(--tea); font-size: clamp(27px, 4vw, 46px); line-height: 1.55; text-align: center; }
    .b-decision { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 54px; font-family: ui-sans-serif, system-ui; }
    .b-card { padding: 26px; border: 1px solid var(--line); background: rgba(255,255,255,.45); }
    .b-card small { color: var(--tea); font-weight: 800; }
    .b-card h3 { color: var(--tea-deep); font-size: 18px; }
    .b-card p { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .b-dock { position: fixed; z-index: 20; top: 50%; right: 22px; transform: translateY(-50%); display: grid; gap: 8px; }
    .b-dot { width: 8px; height: 8px; border: 1px solid rgba(255,255,255,.7); border-radius: 50%; background: transparent; }
    .b-dot.active { background: var(--gold); border-color: var(--gold); transform: scale(1.35); }

    /* Variant C — Analyst desk */
    .c-shell { min-height: 100vh; background: #edf1ed; font-family: ui-sans-serif, system-ui; }
    .c-header { height: 72px; display: grid; grid-template-columns: 290px 1fr auto; align-items: center; gap: 24px; padding: 0 30px; color: #fff; background: var(--tea-deep); }
    .c-logo { font-weight: 850; letter-spacing: -.02em; }
    .c-logo small { display: block; margin-top: 3px; color: #9cc1b6; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
    .c-search { max-width: 520px; padding: 11px 16px; color: #b9cec7; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; font-size: 12px; }
    .c-progress { color: #dbe7e3; font-size: 11px; }
    .c-progress b { color: #ffd77e; }
    .c-theme-button { margin-left: 14px; padding: 8px 12px; color: #fff; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; cursor: pointer; }
    .c-theme-button:hover { color: var(--tea-deep); background: var(--gold); }
    .c-grid { min-height: calc(100vh - 72px); display: grid; grid-template-columns: 290px minmax(0, 1fr) 330px; }
    .c-nav { padding: 28px 22px 110px; background: #f7faf7; border-right: 1px solid #d8dfda; }
    .c-nav-label { margin: 0 10px 12px; color: #8a9691; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    .c-part { margin: 24px 10px 9px; color: var(--tea-deep); font-size: 11px; font-weight: 850; }
    .c-nav a { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 10px; color: #64706b; border-radius: 7px; font-size: 12px; line-height: 1.45; }
    .c-nav a span:first-child { color: #a1aca7; font-variant-numeric: tabular-nums; }
    .c-nav a.active { color: #fff; background: var(--tea); box-shadow: 0 10px 24px rgba(58,125,107,.22); }
    .c-nav a.active span:first-child { color: #cfe3dd; }
    .c-main { padding: 46px clamp(30px, 5vw, 80px) 120px; background: #fff; }
    .c-crumb { color: #8e9995; font-size: 11px; }
    .c-main h1 { max-width: 820px; margin: 16px 0 20px; color: var(--tea-deep); font: 800 clamp(36px, 4vw, 56px)/1.2 ui-serif, "Noto Serif SC", serif; letter-spacing: -.04em; }
    .c-summary { max-width: 760px; margin-bottom: 34px; padding: 20px 22px; color: #52605b; background: #eff6f2; border-radius: 10px; font-size: 14px; line-height: 1.8; }
    .c-main h2 { margin: 42px 0 14px; color: var(--tea-deep); font: 700 25px/1.35 ui-serif, "Noto Serif SC", serif; }
    .c-main p { max-width: 780px; color: #424b48; font: 17px/2 ui-serif, "Noto Serif SC", serif; }
    .c-math { max-width: 780px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; margin: 30px 0; padding: 22px 24px; background: #fffaf0; border: 1px solid #ecd69e; border-radius: 10px; }
    .c-math code { color: #6d5316; font-size: 21px; font-weight: 850; }
    .c-math span { padding: 7px 10px; color: #775f25; background: #f7e5b4; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .c-aside { padding: 28px 24px 110px; background: #f4f6f3; border-left: 1px solid #d8dfda; }
    .c-aside h2 { margin: 0 0 18px; color: var(--tea-deep); font-size: 16px; }
    .memo { padding: 20px; background: #fff; border: 1px solid #dfe5e1; border-radius: 10px; box-shadow: 0 10px 30px rgba(35,75,66,.06); }
    .memo-row { padding: 14px 0; border-bottom: 1px solid #e7ebe8; }
    .memo-row:last-child { border-bottom: 0; }
    .memo-row small { display: block; margin-bottom: 7px; color: #929c98; font-size: 9px; font-weight: 850; letter-spacing: .12em; }
    .memo-row b { color: var(--tea-deep); font-size: 13px; }
    .memo-row p { margin: 7px 0 0; color: #6d7873; font-size: 11px; line-height: 1.65; }
    .c-meter { margin-top: 18px; padding: 18px; color: #fff; background: var(--tea-deep); border-radius: 10px; }
    .c-meter small { color: #a9c5bc; font-size: 9px; letter-spacing: .1em; }
    .c-meter strong { display: block; margin: 9px 0 12px; font-size: 18px; }
    .c-meter-line { height: 6px; overflow: hidden; background: rgba(255,255,255,.13); border-radius: 99px; }
    .c-meter-line span { display: block; width: 18%; height: 100%; background: var(--gold); }

    @media (max-width: 1050px) {
      .a-grid { grid-template-columns: 220px minmax(0, 1fr); gap: 28px; }
      .a-margin { display: none; }
      .c-grid { grid-template-columns: 230px minmax(0, 1fr); }
      .c-aside { display: none; }
      .c-header { grid-template-columns: 230px 1fr; }
      .c-progress { display: none; }
    }
    @media (max-width: 740px) {
      .proto-badge { top: 10px; right: 10px; }
      .switcher { bottom: 10px; }
      .switcher-label { min-width: 168px; padding: 0 8px; }
      .a-top { padding: 0 18px; }
      .a-brand span { display: none; }
      .a-grid { display: block; padding: 0 0 100px; }
      .a-sidebar { position: static; padding: 24px 18px 0; }
      .a-book-mini, .a-toc-title, .a-toc a:not(.active) { display: none; }
      .a-toc { margin-bottom: 12px; }
      .a-article { padding: 42px 24px 60px; border: 0; box-shadow: none; }
      .a-article h1 { font-size: 39px; }
      .scene { margin: 34px -24px; padding: 28px 24px; border-radius: 0; }
      .b-hero { min-height: 88vh; padding: 90px 24px 62px; align-items: end; }
      .b-shop { top: 11vh; right: -16vw; width: 78vw; opacity: .55; }
      .b-title h1 { font-size: 51px; }
      .b-reading { padding: 76px 24px 120px; }
      .b-quote { margin: 54px -24px; padding: 50px 24px; }
      .b-decision { grid-template-columns: 1fr; }
      .b-dock { display: none; }
      .c-header { height: 64px; grid-template-columns: 1fr auto; padding: 0 18px; }
      .c-search { width: 38px; overflow: hidden; white-space: nowrap; color: transparent; }
      .c-grid { display: block; min-height: calc(100vh - 64px); }
      .c-nav { padding: 14px 18px; border: 0; border-bottom: 1px solid #d8dfda; }
      .c-nav-label, .c-part, .c-nav a:not(.active) { display: none; }
      .c-main { padding: 36px 22px 110px; }
      .c-main h1 { font-size: 39px; }
      .c-math { grid-template-columns: 1fr; }
    }
  </style>

        <aside class="a-sidebar">
          <div class="a-book-mini"><small>一本写给普通人的投资入门书</small><h2>用一家奶茶店<br>学会股票投资</h2><p>从看懂一门生意，到判断它值多少钱、能否长期复利。</p></div>

        </aside>
        <article class="a-article">
          <div class="eyebrow">序章 · 阅读约 18 分钟</div>
          <h1>如果我真的要买下一家奶茶店</h1>
          <p class="dek">买下一门生意，与买入一只股票，本质上有什么相同，又有什么不同？</p>
          <div class="scene">2025年初的一个晚上，九点半，青禾茶铺送走了最后一位顾客。老板从抽屉里拿出一本账本、一串钥匙和一张设备清单，然后说：<br><strong>“2024年赚了15万元。你要是愿意接，80万元。”</strong></div>
          <h2>80万元，五年多回本？</h2>
          <p>最容易想到的算法是：如果每年都能赚15万元，80万元大约五年多就能赚回来。它甚至会让人产生一种错觉：只要数字没有算错，这就是一笔年回报接近19%的投资。</p>
          <div class="formula">15 ÷ 80 = 18.75%</div>
          <p>但你真正要问的第一句话，不应该是“18.75%高不高”，而应该是：这15万元，究竟是怎样赚出来的？</p>
          <div class="callout"><b>本章结论</b>投资不是寻找一个万能指标，而是逐步回答：这门生意怎么赚钱、赚到的钱是否真实、能否持续复利，以及今天的价格是否值得。</div>
          <h2>目前知道的，远少于不知道的</h2>
          <p>老板有没有给自己发工资？设备是不是快要更换？店铺租约还能续多久？顾客为什么会继续回来？这些问题不能靠一年的净利润回答。</p>
        </article>
        <aside class="a-margin"><strong>本章进度</strong><div class="ring">18%</div><p>下一节：<br>我买下的究竟是什么？</p></aside>
      </div>
    </div>
  </template>

        <article class="c-main"><div class="c-crumb">前置章节　/　序章　/　阅读约18分钟</div><h1>如果我真的要买下一家奶茶店</h1><div class="c-summary"><b>本章只回答一个问题：</b>买下一门生意，与买入一只股票，本质上有什么相同，又有什么不同？</div><h2>80万元，五年多回本？</h2><p>老板告诉你，青禾茶铺去年营业收入120万元，净利润15万元，整家店开价80万元。最容易想到的算法，是拿15除以80。</p><div class="c-math"><code>15 ÷ 80 = 18.75%</code><span>第一版粗略收益率</span></div><p>这个数字没有算错，但问题问错了。它默认未来利润不变，也没有考虑老板工资、设备更新、营运资金和债务。你需要先理解这门生意，才能讨论价格。</p><h2>为什么不能立刻报价？</h2><p>真正的投资分析，不是找到一个看起来漂亮的数字，而是把主张、证据、反证和下一步行动连接起来。右侧的投资备忘录会随着每一章持续更新。</p></article>
        <aside class="c-aside"><h2>投资备忘录 · v0.1</h2><div class="memo"><div class="memo-row"><small>当前主张</small><b>青禾茶铺可能是一门不错的生意</b><p>但现有证据不足以支持80万元报价。</p></div><div class="memo-row"><small>已有证据</small><b>2024年收入120万，净利润15万</b><p>数字来自老板陈述，尚未经过流水和报税材料核验。</p></div><div class="memo-row"><small>关键未知</small><b>正常化利润、现金流、租约与设备</b><p>任何一项都可能改变价值判断。</p></div><div class="memo-row"><small>当前行动</small><b style="color:#a97813">暂不报价</b><p>先完成第1章的商业模式验证。</p></div></div><div class="c-meter"><small>报价置信度</small><strong>18% · 信息严重不足</strong><div class="c-meter-line"><span></span></div></div></aside>

  <script>
    const variants = {
      A: { name: '纸本主题', template: 'variantA' },
      C: { name: '研究主题', template: 'variantC' }
    };
    const keys = Object.keys(variants);
    const app = document.getElementById('app');
    const label = document.getElementById('variantLabel');
    const progress = document.getElementById('progressFill');
    let current = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    if (!variants[current]) current = 'A';

    function render(key, updateUrl = true) {
      current = key;
      const variant = variants[key];
      app.replaceChildren(document.getElementById(variant.template).content.cloneNode(true));
      label.textContent = `${key} · ${variant.name}`;
      document.title = `${key} · ${variant.name}｜书站 UI Prototype`;
      window.scrollTo({ top: 0, behavior: 'instant' });
      progress.style.width = '0%';
      if (updateUrl) {
        const url = new URL(location.href);
        url.searchParams.set('variant', key);
        history.replaceState({ variant: key }, '', url);
      }
    }
    function cycle(direction) {
      const index = keys.indexOf(current);
      render(keys[(index + direction + keys.length) % keys.length]);
    }
    document.getElementById('previous').addEventListener('click', () => cycle(-1));
    document.getElementById('next').addEventListener('click', () => cycle(1));
    document.addEventListener('keydown', (event) => {
      const target = event.target;
      if (target.matches('input, textarea, [contenteditable="true"]')) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    window.addEventListener('scroll', () => {
      const height = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = `${height > 0 ? (window.scrollY / height) * 100 : 0}%`;
    }, { passive: true });
    render(current, false);
  </script>
